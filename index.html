<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)">
  <title>Code de l’Escale</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=viewport-cursor-2">
  <script src="speckles.js" defer></script>
  <script src="parallax.js?v=viewport-cursor-2" defer></script>
</head>
<body>
  <main class="canvas" aria-label="Code de l’Escale">
    <div class="art" role="img" aria-label="Code de l’Escale, logo rétro turquoise sur un triangle rose, entouré d’une orbite jaune avec un curseur pixelisé.">
      <div class="triangle-shadow"></div>
      <div class="triangle"><div class="speckles" aria-hidden="true"></div></div>
      <div class="orbit orbit-back orbit-shadow"></div><div class="orbit orbit-back"></div>
      <div class="wordmark" aria-hidden="true"><span class="capital">C</span><span>ode</span></div>
      <div class="tagline" aria-hidden="true"><span>de l’</span>Escale</div>
      <div class="orbit orbit-front orbit-shadow"></div><div class="orbit orbit-front"></div>
      <div class="cursor-layer" aria-hidden="true">
        <div class="cursor"><span class="cursor-tip"></span><div class="cursor-fill"></div></div>
      </div>
      <div class="rays"><i></i><i></i><i></i></div>
    </div>
  </main>
</body>
</html>
